      <stop offset="0%" style="stop-color:#eef2ff"/>
      <stop offset="100%" style="stop-color:#c7d2fe"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#gbg3)"/>
  <!-- Pi symbol celebration -->
  <g transform="translate(400,220)">
