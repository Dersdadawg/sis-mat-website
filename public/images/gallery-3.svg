    <circle cx="40" cy="-70" r="3" fill="#a5b4fc" opacity="0.5"/>
  </g>
  <text x="400" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#4338ca">Pi Day Celebration</text>
  <text x="400" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#6366f1">Gallery Photo 3</text>
