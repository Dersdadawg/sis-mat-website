<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81"/>
      <stop offset="50%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="60%" r="35%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <!-- Decorative math symbols -->
  <text x="200" y="300" font-family="serif" font-size="120" fill="#818cf8" opacity="0.08" transform="rotate(-15,200,300)">∑</text>
  <text x="1600" y="250" font-family="serif" font-size="100" fill="#818cf8" opacity="0.08" transform="rotate(10,1600,250)">∫</text>
  <text x="400" y="800" font-family="serif" font-size="90" fill="#818cf8" opacity="0.08" transform="rotate(5,400,800)">π</text>
  <text x="1400" y="850" font-family="serif" font-size="110" fill="#818cf8" opacity="0.08" transform="rotate(-8,1400,850)">∞</text>
  <text x="900" y="200" font-family="serif" font-size="80" fill="#818cf8" opacity="0.06" transform="rotate(12,900,200)">Δ</text>
  <text x="1100" y="900" font-family="serif" font-size="95" fill="#818cf8" opacity="0.06" transform="rotate(-20,1100,900)">φ</text>
  <text x="300" y="550" font-family="serif" font-size="85" fill="#818cf8" opacity="0.05">θ</text>
  <text x="1650" y="600" font-family="serif" font-size="75" fill="#818cf8" opacity="0.05">λ</text>
  <!-- Subtle grid dots -->
  <pattern id="dots" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
    <circle cx="30" cy="30" r="1" fill="#a5b4fc" opacity="0.1"/>
  </pattern>
  <rect width="1920" height="1080" fill="url(#dots)"/>
</svg>
